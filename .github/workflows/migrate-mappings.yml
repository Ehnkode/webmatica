# One-off: moves the sources from Yarn to Mojang names, builds, and commits the result.
# Deletes itself in that commit.
name: migrate-mappings
on:
  push:
    branches: [mojmap-migrate]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.11" --overrideInputsIHaveABackup
      - run: sed -i 's|mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"|mappings loom.officialMojangMappings()|' build.gradle && sed -i '/^yarn_mappings=/d' gradle.properties
      - run: ./gradlew build
        continue-on-error: true
      - run: |
          git rm -q .github/workflows/migrate-mappings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Yarn to Mojang mappings (Loom migrateMappings on 1.21.11)"
          git push

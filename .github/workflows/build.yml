# Builds the mod on every push and pull request. A new GitHub release
# (or a pushed "v*" tag) gets the finished jar attached automatically.
name: build
on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - name: Build all Minecraft versions
        run: |
          set -o pipefail
          ./gradlew buildAll --continue 2>&1 | tee build.log || {
            echo "::group::Compile errors (summary)"; echo
            grep -E "error:|symbol:|What went wrong" build.log | sed -E 's#^.*/versions/([^/]+)/.*/webmatica/#[\1] #' | head -200
            echo "::endgroup::"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: webmatica-mod
          path: build/libs/
      - name: Attach jar to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/webmatica-*.jar

  # The web page's English table covers every German text (tools/check_i18n.py).
  i18n:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest tools/check_i18n.py -v

  # Block and item images are built from the player's game jar on first start;
  # make sure that still works for every supported Minecraft version.
  viewer-assets:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/download-artifact@v8
        with:
          name: webmatica-mod
          path: libs
      - name: Download the Minecraft ${{ matrix.minecraft }} client jar and Gson
        run: |
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            | jq -r --arg v '${{ matrix.minecraft }}' '.versions[] | select(.id==$v) | .url')
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o client.jar "$(curl -s "$url" | jq -r '.downloads.client.url')"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o gson.jar https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar
      - name: Build block and item images
        run: |
          mod=$(ls libs/webmatica-*+mc1.21.11.jar | grep -v sources | head -1)
          java -cp "$mod:gson.jar" io.github.ehnkode.webmatica.viewer.AssetBuilder client.jar assets
          test -n "$(ls -A assets)"

  # A published GitHub release also goes to Modrinth and CurseForge, one version per Minecraft
  # version. Needs the repository secrets MODRINTH_TOKEN / CURSEFORGE_TOKEN and the variables
  # MODRINTH_ID / CURSEFORGE_ID (see docs/publishing.md); without them this job does nothing.
  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: '1.21.11', java: '21' }
          - { minecraft: '26.1.2', java: '25' }
          - { minecraft: '26.2', java: '25' }
          - { minecraft: '26.3', java: '25' }
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: webmatica-mod
          path: libs
      - name: Publish for Minecraft ${{ matrix.minecraft }}
        if: env.MODRINTH_TOKEN != '' || env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: libs/webmatica-*+mc${{ matrix.minecraft }}.jar
          name: Webmatica ${{ github.event.release.tag_name }} (Minecraft ${{ matrix.minecraft }})
          version-type: ${{ contains(github.event.release.tag_name, 'alpha') && 'alpha' || (contains(github.event.release.tag_name, 'beta') && 'beta' || 'release') }}
          changelog: ${{ github.event.release.body }}
          loaders: fabric
          java: ${{ matrix.java }}
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}

# Baut die Mod bei jedem Push und Pull Request. Ein Tag "v*" (z. B. v0.4.0)
# legt zusaetzlich ein Release mit der fertigen Jar an.
name: build
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: webmatica-mod
          path: build/libs/
      - name: Release (nur bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/webmatica-*[0-9].jar

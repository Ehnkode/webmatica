# Builds the mod on every push and pull request. A new GitHub release
# (or a pushed "v*" tag) gets the finished jar attached automatically.
name: build
on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - name: Build all Minecraft versions
        run: |
          set -o pipefail
          ./gradlew buildAll --continue 2>&1 | tee build.log || {
            echo "::group::Compile errors (summary)"; echo
            grep -E "error:|symbol:|What went wrong" build.log | sed -E 's#^.*/versions/([^/]+)/.*/webmatica/#[\1] #' | head -200
            echo "::endgroup::"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: webmatica-mod
          path: build/libs/
      - name: Attach jar to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/webmatica-*.jar

  viewer-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s viewer/tests -t . -v

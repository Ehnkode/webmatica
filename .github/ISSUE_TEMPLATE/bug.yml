name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Webmatica mod version, Minecraft version, and whether Litematica / Baritone / Printer are installed
      placeholder: "webmatica 0.9.0, Minecraft 1.21.11, Litematica yes, Baritone yes"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Map / 3D, Schematics / Editor, Auto build, Farming, Chests, Other]
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: The viewer window output or logs/latest.log helps a lot. Please remove coordinates you don't want to share.
